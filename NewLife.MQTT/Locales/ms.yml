# Bahasa Melayu 词表（ms）。键为英文源文，与源码字符串逐字一致；缺少的键运行时回退英文。
"The cluster shared secret does not match.": "Rahsia kongsi kluster tidak sepadan."
"Message exchange is not configured.": "Pertukaran mesej tidak dikonfigurasikan."
"Invalid management token.": "Token pengurusan tidak sah."
"The message payload length is insufficient.": "Panjang muatan mesej tidak mencukupi."
"QUIC is not supported on this platform; Windows 11 or Linux with msquic is required.": "QUIC tidak disokong pada platform ini; Windows 11 atau Linux dengan msquic diperlukan."
"For SSL connections, the address must start with tcp://.": "Untuk sambungan SSL, alamat mesti bermula dengan tcp://."
"The MQTT protocol does not support sending headers and bodies separately.": "Protokol MQTT tidak menyokong penghantaran pengepala dan badan secara berasingan."
"ServiceProvider is not configured.": "ServiceProvider tidak dikonfigurasikan."
"QuicCertificate must be specified to start a QUIC listener; QUIC requires TLS.": "QuicCertificate mesti dinyatakan untuk memulakan pendengar QUIC; QUIC memerlukan TLS."
