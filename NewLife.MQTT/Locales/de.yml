# Deutsch 词表（de）。键为英文源文，与源码字符串逐字一致；缺少的键运行时回退英文。
"The cluster shared secret does not match.": "Das gemeinsame Geheimnis des Clusters stimmt nicht überein."
"Message exchange is not configured.": "Der Nachrichtenaustausch ist nicht konfiguriert."
"Invalid management token.": "Ungültiges Verwaltungstoken."
"The message payload length is insufficient.": "Die Länge der Nachrichtennutzlast ist unzureichend."
"QUIC is not supported on this platform; Windows 11 or Linux with msquic is required.": "QUIC wird auf dieser Plattform nicht unterstützt; erforderlich sind Windows 11 oder Linux mit msquic."
"For SSL connections, the address must start with tcp://.": "Bei SSL-Verbindungen muss die Adresse mit tcp:// beginnen."
"The MQTT protocol does not support sending headers and bodies separately.": "Das MQTT-Protokoll unterstützt das separate Senden von Headern und Inhalten nicht."
"ServiceProvider is not configured.": "ServiceProvider ist nicht konfiguriert."
"QuicCertificate must be specified to start a QUIC listener; QUIC requires TLS.": "QuicCertificate muss angegeben werden, um einen QUIC-Listener zu starten; QUIC erfordert TLS."
