# Norsk bokmål 词表（nb）。键为英文源文，与源码字符串逐字一致；缺少的键运行时回退英文。
"The cluster shared secret does not match.": "Klyngens delte hemmelighet stemmer ikke."
"Message exchange is not configured.": "Meldingsutveksling er ikke konfigurert."
"Invalid management token.": "Ugyldig administrasjonstoken."
"The message payload length is insufficient.": "Nyttelasten i meldingen er for kort."
"QUIC is not supported on this platform; Windows 11 or Linux with msquic is required.": "QUIC støttes ikke på denne plattformen; Windows 11 eller Linux med msquic kreves."
"For SSL connections, the address must start with tcp://.": "For SSL-tilkoblinger må adressen begynne med tcp://."
"The MQTT protocol does not support sending headers and bodies separately.": "MQTT-protokollen støtter ikke å sende headere og kropp separat."
"ServiceProvider is not configured.": "ServiceProvider er ikke konfigurert."
"QuicCertificate must be specified to start a QUIC listener; QUIC requires TLS.": "QuicCertificate må angis for å starte en QUIC-lytter; QUIC krever TLS."
