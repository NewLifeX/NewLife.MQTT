# 繁體中文譯文。鍵為英文源文，缺失時執行期回退英文。
"The cluster shared secret does not match.": "集群共享密鑰不匹配"
"Message exchange is not configured.": "未配置消息交換機 Exchange"
"Invalid management token.": "無效的管理令牌"
"The message payload length is insufficient.": "消息負載的數據長度不足！"
"QUIC is not supported on this platform; Windows 11 or Linux with msquic is required.": "當前平臺不支持 QUIC，需要 Windows 11 或安裝 msquic 的 Linux"
"For SSL connections, the address must start with tcp://.": "使用SSL連接，地址需設置為tcp://開頭"
"The MQTT protocol does not support sending headers and bodies separately.": "MQTT 協議不支持頭部與幀體分段發送"
"ServiceProvider is not configured.": "未配置服務提供者ServiceProvider"
"QuicCertificate must be specified to start a QUIC listener; QUIC requires TLS.": "啟動 QUIC 監聽必須指定 QuicCertificate，QUIC 強制 TLS"
